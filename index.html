<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thói Quen</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf7ff">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Thói Quen">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-180.png">
<!-- CSS tối thiểu cho màn hình chào: chỉ hiện khi mở từ màn hình chính (standalone) -->
<style>
  html,body{margin:0;background:#faf7ff}
  #splash{display:none}
  @media (display-mode: standalone){
    #splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#faf7ff}
  }
</style>
<link rel="stylesheet" href="./style.css">
</head>
<body>

<!-- Màn hình chào (~0,8 giây, JS sẽ gỡ) -->
<div id="splash" aria-hidden="true"><img src="./icon-192.png" width="112" height="112" alt=""></div>

<!-- Kho icon SVG (icons.js sẽ nạp vào đây) -->
<svg id="sprite" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"></svg>

<!-- Khóa PIN 4 số (ui.js dựng bàn phím) -->
<div id="lock" class="lock" hidden></div>

<!-- Dải nhắc nhỏ: "Hôm nay còn X thói quen" -->
<div id="remind" class="remind" hidden></div>

<!-- Năm màn hình – nội dung do JS dựng -->
<main id="main">
  <section class="screen" id="screen-habits"   data-screen="habits"   aria-label="Thói quen"></section>
  <section class="screen" id="screen-manage"   data-screen="manage"   aria-label="Quản lý" hidden></section>
  <section class="screen" id="screen-history"  data-screen="history"  aria-label="Lịch sử" hidden></section>
  <section class="screen" id="screen-stats"    data-screen="stats"    aria-label="Thống kê" hidden></section>
  <section class="screen" id="screen-settings" data-screen="settings" aria-label="Cài đặt" hidden></section>
</main>

<!-- Thanh điều hướng dưới (nhãn luôn 1 hàng) -->
<nav class="tabbar" id="tabbar" aria-label="Điều hướng">
  <button class="tab is-active" data-tab="habits"   aria-current="page"><svg class="ic"><use href="#ui-habits"/></svg><span>Thói quen</span></button>
  <button class="tab" data-tab="manage"   ><svg class="ic"><use href="#ui-manage"/></svg><span>Quản lý</span></button>
  <button class="tab" data-tab="history"  ><svg class="ic"><use href="#ui-history"/></svg><span>Lịch sử</span></button>
  <button class="tab" data-tab="stats"    ><svg class="ic"><use href="#ui-stats"/></svg><span>Thống kê</span></button>
  <button class="tab" data-tab="settings" ><svg class="ic"><use href="#ui-settings"/></svg><span>Cài đặt</span></button>
</nav>

<!-- Nút hoàn tác tròn, góc phải dưới, có vòng đếm ngược 5 giây -->
<button id="undo" class="undo" hidden aria-label="Hoàn tác">
  <svg class="ring" viewBox="0 0 48 48" aria-hidden="true"><circle class="ring-bg" cx="24" cy="24" r="21"/><circle class="ring-fg" cx="24" cy="24" r="21"/></svg>
  <svg class="ic"><use href="#ui-undo"/></svg>
</button>

<!-- Thông báo ngắn -->
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<!-- Bảng trượt từ dưới lên (form, hộp thoại xác nhận) -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" id="sheet-panel"></div>
</div>

<script src="./icons.js" defer></script>
<script src="./core.js" defer></script>
<script src="./ui.js" defer></script>
<script src="./app.js" defer></script>
</body>
</html>
